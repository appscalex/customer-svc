<!-- Header component start-->
<app-header [logoImg]="logoImage" [navItemList]="navItems" [contactInfo]="contactInfo"></app-header>
<!-- Header component end-->
<app-top-banner [data]="data"></app-top-banner>
<div class="main-content">
  <section>
    <div class="container">
    <div class="row">
      <div *ngFor="let list of List" class="col-sm-4">
        <div class="consult-services wow fadeInUp contact-detail text-center">
          <div class="circle-effect"> <i aria-hidden="true" class="fa fa-map-marker"></i> </div>
          <h4 class="mb-2">{{ list.title }}</h4>
          <p class="mb-0">{{ list.address }}</p>
        </div>
      </div>
    </div>
    </div>
  </section>
  <!-- Contact us page -->
  <section class="pt-0">
    <div class="container">
      <div class="row  align-items-center ">
        <div class="col-sm-6">
          <h2 class="text-left mb-4">Let's talk about for your<br> business</h2>
          <div class="response-output "></div>
          <form [formGroup]="angForm" novalidate (ngSubmit)="onSubmit()" novalidate>
            <div class="contact-form form-group">
              <div class=""> 
                <input type="text" name="your-name" formControlName="name" class="form-control text" placeholder="Your Name" required> 
                <div *ngIf="angForm.controls['name'].invalid && (angForm.controls['name'].dirty || angForm.controls['name'].touched)" class="alert alert-danger">
                  <div *ngIf="angForm.controls['name'].errors.required"> Name is required.</div>
                </div>
              </div>
              <div class=""> 
                <input type="text" name="your-email" formControlName="email" class="form-control text" placeholder="Your Email" required> 
                <div *ngIf="angForm.controls['email'].invalid && (angForm.controls['email'].dirty || angForm.controls['email'].touched)" class="alert alert-danger">
                  <div *ngIf="angForm.controls['email'].errors.required"> Email is required.</div>
                </div>
              </div>
              <div class=""> 
                <input type="text" name="your-name" formControlName="phone" class="form-control text" placeholder="Your Phone"> 
              </div>
              <div class=""> 
                <input type="text" name="subject" formControlName="subject" class="form-control text" placeholder="Subject" required> 
                <div *ngIf="angForm.controls['subject'].invalid && (angForm.controls['subject'].dirty || angForm.controls['subject'].touched)" class="alert alert-danger">
                  <div *ngIf="angForm.controls['subject'].errors.required"> Subject is required.</div>
                </div>
              </div>
              <div class=""> 
                <textarea name="your-message" formControlName="message"  cols="40" rows="10" class="form-control textarea " placeholder="Message" required></textarea>
                <div *ngIf="angForm.controls['message'].invalid && (angForm.controls['message'].dirty || angForm.controls['message'].touched)" class="alert alert-danger">
                  <div *ngIf="angForm.controls['message'].errors.required"> Message is required.</div>
                </div>
              </div>
              <div> <button id="submit-4" name="submit" type="submit" value="Send"  class="button d-block w-100">Send Message</button> </div>
            </div>
         </form>
        </div>
        <div class="mt-5 col-sm-6 offset-lg-1 col-lg-5 offset-md-1 col-md-5">
          <div class="wrapper">
            <div class="contact-box d-flex">
              <i aria-hidden="true" class="ion ion-android-call"></i>
              <div class="service-detail">
                <h4 class="mb-2">Phone support</h4>
                <ul class="list-inline mb-0">
                  <li> <a href="tel:+91-8638386533"> +91-8638386533</a> </li>
                </ul>
              </div>
            </div>
            <div class="contact-box d-flex   ">
              <i aria-hidden="true" class="fa fa-envelope-o"></i>
              <div class="service-detail">
                <h4 class="mb-2">Email us</h4>
                <ul class="list-inline mb-0">
                  <li><a href="mailto:support@appscalex.com"> support@appscalex.com</a></li>
                </ul>
              </div>
            </div>
            <div class="contact-box d-flex   ">
              <i aria-hidden="true" class="ion ion-android-share-alt"></i>
              <div class="service-detail">
                <h4 class="mb-2">Social media</h4>
                <ul>
                  <li class="d-inline"><a href="#"><i class="fa fa-facebook-f"></i></a></li>
                  <li class="d-inline"><a href="#"><i class="fa fa-twitter"></i></a></li>
                  <li class="d-inline"><a href="#"><i class="fa fa-instagram"></i></a></li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- Contact us page End-->
</div>
<!-- Footer start -->
<app-footer [logoImg]="logoImage" [contactInfo]="contactInfo"></app-footer>
<!-- Footer end -->
