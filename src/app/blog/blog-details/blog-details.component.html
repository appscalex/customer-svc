<app-header [logoImg]="logoImage" [navItemList]="navItems" [contactInfo]="contactInfo"></app-header>
<app-top-banner [data]="data"></app-top-banner>

<div class="main-content">
    <section>
        <div class="container">
            <div class="container">
                <div class="row">
                    <div class="col-lg-8 col-sm-12">
                        <div class="iq-blog-box">
                            <div class="iq-blog-image wow fadeInUp">
                                <img width="1260" height="954" src="{{details.img}}" class="attachment-post-thumbnail size-post-thumbnail wp-post-image" alt="" />
                                <ul class="iq-blogtag">
                                    <li><a href="#">{{details.name}}</a></li>
                                </ul>
                            </div>
                            <div class="iq-blog-detail">
                                <div class="blog-title">
                                    <a routerLink="#">
                                        <h4>{{ details.title }}</h4>
                                    </a>
                                </div>
                                <div class="iq-blog-meta wow fadeInUp">
                                    <ul class="list-inline">
                                        <li class="list-inline-item"><a href="#" rel="bookmark"> <time class="entry-date published updated" datetime="2019-09-26T06:49:49+00:00">{{details.time}}</time> </a> </li>
                                    </ul>
                                </div>
                                <div class="blog-content">
                                    <div class="blog-content wow fadeInUp">
                                       <p>{{details.details}}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div id="comments" class="comments-area wow fadeInUp">
                            <div id="respond" class="comment-respond">
                                <h3 id="reply-title" class="comment-reply-title mb-3">Leave a Reply <small><a rel="nofollow" id="cancel-comment-reply-link" href="#">Cancel reply</a></small></h3>
                                <form action="#">
                                    <div class="contact-form">
                                        <div class="row">
                                            <div class="col-sm-12">
                                                <label>Comment</label>
                                                <textarea name="your-message" cols="40" rows="10" class="form-control textarea " placeholder="Comment"></textarea>
                                            </div>
                                            <div class="col-lg-4">
                                                <label>Your Name</label>
                                                <input type="text" name="your-name" class="form-control text " placeholder="Your Name">
                                            </div>
                                            <div class="col-lg-4">
                                                <label>Your Email</label>
                                                <input type="text" name="your-email" class="form-control text " placeholder="Your Email">
                                            </div>
                                            <div class="col-lg-4">
                                                <label>Website</label>
                                                <input type="text" name="your-website" class="form-control text " placeholder="Website">
                                            </div>
                                            <div class="col-sm-12">
                                                <input type="submit" class="btn btn-primary mb-4 mb-lg-0" value="Submit">
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4 col-sm-12 sidebar-service-right mt-5 mt-lg-0">
                        <div id="secondary" class="widget-area" >
                            <app-blog-search></app-blog-search>
                            <app-blog-recent-post></app-blog-recent-post>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
<app-footer [logoImg]="logoImage" [contactInfo]="contactInfo"></app-footer>
