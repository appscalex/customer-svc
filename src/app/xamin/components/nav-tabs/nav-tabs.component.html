<div class="ax-stepper-tabs">

  <!-- Step header row -->
  <div class="ax-stepper-nav">
    <ng-container *ngFor="let nav of navList; let i = index; let last = last">

      <!-- Step node -->
      <div class="ax-stepper-node {{ activeId === nav.id ? 'is-active' : '' }} {{ i < activeIndex() ? 'is-done' : '' }}"
           (click)="setActive(nav.id)">
        <div class="ax-stepper-circle">
          <span class="ax-stepper-num">{{ i + 1 }}</span>
        </div>
        <span class="ax-stepper-label">{{ nav.title }}</span>
      </div>

      <!-- Connector line (not after last) -->
      <div *ngIf="!last" class="ax-stepper-line {{ i < activeIndex() ? 'is-done' : '' }}"></div>

    </ng-container>
  </div>

  <!-- Content panels -->
  <ng-container *ngFor="let nav of navList">
    <div class="ax-stepper-panel" *ngIf="activeId === nav.id">
      <div class="row align-items-start">

        <!-- Left: heading + desc + CTA -->
        <div class="col-lg-5 col-md-12 ax-step-left">
          <div class="ax-step-tag">Step {{ navList.indexOf(nav) + 1 }} of {{ navList.length }}</div>
          <h3 class="ax-step-title">{{ nav.subtitle }}</h3>
          <p class="ax-step-desc">{{ nav.desc }}</p>
          <a class="ax-step-cta" href="{{ nav.link }}">
            View all Services <i class="ion-ios-arrow-forward"></i>
          </a>
        </div>

        <!-- Divider -->
        <div class="col-lg-1 d-none d-lg-flex ax-step-divider-col">
          <div class="ax-step-vline"></div>
        </div>

        <!-- Right: feature bullet grid -->
        <div class="col-lg-6 col-md-12 ax-step-right">
          <ul class="ax-step-points">
            <li *ngFor="let point of nav.points" class="ax-step-point">
              <div class="ax-step-point-icon">
                <i class="fa fa-check"></i>
              </div>
              <span>{{ point }}</span>
            </li>
          </ul>
        </div>

      </div>

      <!-- Step navigation buttons -->
      <div class="ax-step-footer">
        <button class="ax-step-btn ax-step-btn--prev"
                *ngIf="activeIndex() > 0"
                (click)="setActive(navList[activeIndex() - 1].id)">
          <i class="ion-ios-arrow-back"></i> Previous
        </button>
        <button class="ax-step-btn ax-step-btn--next"
                *ngIf="activeIndex() < navList.length - 1"
                (click)="setActive(navList[activeIndex() + 1].id)">
          Next <i class="ion-ios-arrow-forward"></i>
        </button>
      </div>

    </div>
  </ng-container>

</div>
